[supervisord]
nodaemon=true

pidfile=/var/run/supervisord/supervisord.pid
logfile=%(ENV_WORKSPACE_LOGGING_DIR)s/%(ENV_WORKSPACE_APP_TYPE)s/supervisord/supervisord.log
logfile_maxbytes=5MB
logfile_backups=10
redirect_stderr=true

[unix_http_server]
file=/var/run/supervisord/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisord/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:workspace-jupyterlab]
directory=%(ENV_HOME)s
command=start-workspace-jupyterlab
autostart=true
autorestart=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Optional extra programs (e.g. HyperPod workspace Native SSH sshd) dropped on the shared workspace volume
[include]
files = /opt/amazon/sagemaker/workspace/native-ssh/*.conf
